<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pirate Sea Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #fff;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      user-select: none;
    }
    #ui h1 { font-size: 1.4rem; margin-bottom: 4px; }
    #ui p { font-size: 0.9rem; opacity: 0.9; }
    #controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      color: #fff;
      text-shadow: 0 1px 3px #000;
      font-size: 0.85rem;
      background: rgba(0,0,0,0.4);
      padding: 10px 14px;
      border-radius: 8px;
    }
  </style>
  <!-- Classic Three.js (works when you just open the file) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <h1>🏴‍☠️ Pirate Sea Adventure</h1>
    <p>Open-world ocean starter</p>
  </div>
  <div id="controls">
    <strong>Controls</strong><br>
    W / ↑ Forward &nbsp;&nbsp; S / ↓ Backward<br>
    A / ← Turn left &nbsp;&nbsp; D / → Turn right
  </div>

  <script>
    // ========== SCENE SETUP ==========
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 50, 400);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
    sun.position.set(50, 80, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 200;
    sun.shadow.camera.left = -50;
    sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    scene.add(sun);

    // ========== OCEAN ==========
    const oceanSize = 500;
    const oceanGeo = new THREE.PlaneGeometry(oceanSize, oceanSize, 64, 64);
    const oceanMat = new THREE.MeshStandardMaterial({
      color: 0x1a6b9a,
      roughness: 0.3,
      metalness: 0.1
    });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.rotation.x = -Math.PI / 2;
    ocean.receiveShadow = true;
    scene.add(ocean);

    // Wave data
    const positions = oceanGeo.attributes.position;
    const originalY = new Float32Array(positions.count);
    for (let i = 0; i < positions.count; i++) {
      originalY[i] = positions.getY(i);
    }

    // ========== SHIP ==========
    const ship = new THREE.Group();

    // Hull
    const hullGeo = new THREE.BoxGeometry(4, 1.2, 8);
    const hullMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.8 });
    const hull = new THREE.Mesh(hullGeo, hullMat);
    hull.position.y = 0.6;
    hull.castShadow = true;
    ship.add(hull);

    // Deck
    const deckGeo = new THREE.BoxGeometry(3.6, 0.15, 7.2);
    const deckMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
    const deck = new THREE.Mesh(deckGeo, deckMat);
    deck.position.y = 1.25;
    deck.castShadow = true;
    ship.add(deck);

    // Mast
    const mastGeo = new THREE.CylinderGeometry(0.12, 0.15, 7, 8);
    const mastMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f });
    const mast = new THREE.Mesh(mastGeo, mastMat);
    mast.position.set(0, 4.5, -0.5);
    mast.castShadow = true;
    ship.add(mast);

    // Sail
    const sailGeo = new THREE.PlaneGeometry(4, 4.5);
    const sailMat = new THREE.MeshStandardMaterial({
      color: 0xf5f0e6,
      side: THREE.DoubleSide,
      roughness: 0.9
    });
    const sail = new THREE.Mesh(sailGeo, sailMat);
    sail.position.set(0, 4.2, -0.5);
    sail.castShadow = true;
    ship.add(sail);

    // Bowsprit
    const bowGeo = new THREE.CylinderGeometry(0.06, 0.08, 3, 6);
    const bow = new THREE.Mesh(bowGeo, mastMat);
    bow.rotation.z = Math.PI / 2;
    bow.position.set(0, 1.4, 4.2);
    ship.add(bow);

    // Cabin
    const cabinGeo = new THREE.BoxGeometry(2.5, 1.4, 2.5);
    const cabin = new THREE.Mesh(cabinGeo, hullMat);
    cabin.position.set(0, 1.9, -2.2);
    cabin.castShadow = true;
    ship.add(cabin);

    ship.position.set(0, 0.3, 0);
    scene.add(ship);

    // ========== ISLANDS ==========
    function createIsland(x, z, scale) {
      scale = scale || 1;
      const group = new THREE.Group();

      const islandGeo = new THREE.ConeGeometry(6 * scale, 3 * scale, 6);
      const islandMat = new THREE.MeshStandardMaterial({ color: 0x4a7c3f, flatShading: true });
      const island = new THREE.Mesh(islandGeo, islandMat);
      island.position.y = 1.2 * scale;
      island.castShadow = true;
      island.receiveShadow = true;
      group.add(island);

      for (let i = 0; i < 3; i++) {
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.15, 0.2, 2.5, 5),
          new THREE.MeshStandardMaterial({ color: 0x5c4033 })
        );
        trunk.position.set(
          (Math.random() - 0.5) * 4 * scale,
          2.5 * scale,
          (Math.random() - 0.5) * 4 * scale
        );
        trunk.castShadow = true;
        group.add(trunk);

        const leaves = new THREE.Mesh(
          new THREE.SphereGeometry(1.2 * scale, 6, 6),
          new THREE.MeshStandardMaterial({ color: 0x2d6a2d, flatShading: true })
        );
        leaves.position.copy(trunk.position);
        leaves.position.y += 1.5 * scale;
        leaves.castShadow = true;
        group.add(leaves);
      }

      group.position.set(x, 0, z);
      scene.add(group);
    }

    createIsland(40, -60, 1.4);
    createIsland(-70, 30, 1.1);
    createIsland(90, 80, 1.6);
    createIsland(-30, -90, 0.9);

    // ========== CONTROLS ==========
    const keys = {};
    window.addEventListener('keydown', function(e) { keys[e.code] = true; });
    window.addEventListener('keyup', function(e) { keys[e.code] = false; });

    let shipSpeed = 0;
    const maxSpeed = 0.35;
    const acceleration = 0.008;
    const turnSpeed = 0.025;

    const cameraOffset = new THREE.Vector3(0, 10, 18);

    // ========== ANIMATION LOOP ==========
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Waves
      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const z = positions.getZ(i);
        const wave = Math.sin(x * 0.05 + t * 1.2) * 0.4 +
                     Math.sin(z * 0.07 + t * 0.9) * 0.3;
        positions.setY(i, originalY[i] + wave);
      }
      positions.needsUpdate = true;
      oceanGeo.computeVertexNormals();

      // Ship movement
      if (keys['KeyW'] || keys['ArrowUp']) {
        shipSpeed = Math.min(shipSpeed + acceleration, maxSpeed);
      } else if (keys['KeyS'] || keys['ArrowDown']) {
        shipSpeed = Math.max(shipSpeed - acceleration, -maxSpeed * 0.5);
      } else {
        shipSpeed *= 0.98;
        if (Math.abs(shipSpeed) < 0.001) shipSpeed = 0;
      }

      if (keys['KeyA'] || keys['ArrowLeft']) {
        ship.rotation.y += turnSpeed * (shipSpeed >= 0 ? 1 : -1);
      }
      if (keys['KeyD'] || keys['ArrowRight']) {
        ship.rotation.y -= turnSpeed * (shipSpeed >= 0 ? 1 : -1);
      }

      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(ship.quaternion);
      ship.position.add(direction.multiplyScalar(shipSpeed));

      // Bobbing
      ship.position.y = 0.4 + Math.sin(t * 2.5) * 0.15;
      ship.rotation.z = Math.sin(t * 1.8) * 0.03;

      // Camera follow
      const desiredCameraPos = ship.position.clone().add(
        cameraOffset.clone().applyQuaternion(ship.quaternion)
      );
      camera.position.lerp(desiredCameraPos, 0.08);
      camera.lookAt(ship.position.x, ship.position.y + 2, ship.position.z);

      renderer.render(scene, camera);
    }

    animate();

    // Resize
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
